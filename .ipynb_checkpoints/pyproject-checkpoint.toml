[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "funcionesPython"
version = "0.1.0"
authors = [
  { name="Julene Viña Albizu" },
]
description = "Módulo de la asignatura Software Matematico y Estadistico desarrollado en Python."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]